// Storage adapter — implements the same window.storage.get/set/delete/list
// interface the app already uses, but backed by your own Supabase project
// instead of Claude's storage. Nothing else in the app had to change.
(function () {
  const SUPABASE_URL = "https://adgsdwrktkonlwtpbvdy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Y8Li2Qt9LLbFn5h0Mh_mdw_Le3HdgUE";

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  window.storage = {
    async get(key) {
      const { data, error } = await client
        .from("kv_store")
        .select("value")
        .eq("key", key)
        .maybeSingle();
      if (error) throw error;
      if (!data) throw new Error("not found: " + key);
      return { key, value: data.value, shared: false };
    },

    async set(key, value) {
      const { error } = await client
        .from("kv_store")
        .upsert({ key, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return { key, value, shared: false };
    },

    async delete(key) {
      const { error } = await client.from("kv_store").delete().eq("key", key);
      return { key, deleted: !error, shared: false };
    },

    async list(prefix) {
      let query = client.from("kv_store").select("key");
      if (prefix) query = query.like("key", prefix + "%");
      const { data, error } = await query;
      if (error) throw error;
      return { keys: (data || []).map((d) => d.key), prefix, shared: false };
    },
  };
})();
</script>

/* Guess a swatch dot color from the paint name — decorative only. */
function guessSwatchColor(name) {
  const n = name.toLowerCase();
  const map = [
    [/black|abaddon|anthracite|jet|ash black/, "#1C1A19"],
    [/white|bone|corax|skeleton|dead white|ghostly/, "#DED9CC"],
    [/red|crimson|blood|gore|dragon|mephiston/, "#9C2B32"],
    [/orange|lava|rust|napalm|tan|sunset/, "#C1652E"],
    [/yellow|gold|daemonic|golden/, "#C9A227"],
    [/green|slime|verdigris|goblin|death guard/, "#4C6B3A"],
    [/teal|turquoise|verdigris/, "#2E7A72"],
    [/blue|sky|ultramarine|prussian|crystal|electric|magic/, "#2C5C8A"],
    [/purple|warlord|traitor|magic/, "#6A4C82"],
    [/pink|screamer/, "#C46B95"],
    [/grey|gray|storm|cold|warm|steel|drab/, "#8A857F"],
    [/silver|metal|leadbelcher|plate mail/, "#B9B9B9"],
    [/bronze/, "#8C6239"],
    [/brown|umber|leather|charred|earth/, "#6B4A32"],
    [/flesh|skin/, "#C99B77"],
    [/sepia|earthshade|oil/, "#5A3E20"],
  ];
  for (const [re, hex] of map) if (re.test(n)) return hex;
  return "#6E6A66";
}

/* Resize + compress an image file to a data URL. */
function fileToResizedDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------
   Shown when a load fails after retries. Never bypassed
   automatically — starting fresh requires an explicit tap,

function DataLoadError({ message, onRetry, onStartFresh }) {
  const [confirmFresh, setConfirmFresh] = useState(false);
  return (
    <div
      style={{
        background: BG,
        minHeight: "100vh",
        display: "flex",

        <PrimaryBtn onClick={onRetry} style={{ marginBottom: 12, width: "100%", justifyContent: "center" }}>
          Try again
        </PrimaryBtn>
        {!confirmFresh ? (
          <button
            onClick={() => setConfirmFresh(true)}
            style={{
              width: "100%",
              background: "transparent",
              border: `1px solid ${LINE}`,
              color: INK_MUTED,
              borderRadius: 10,
              padding: "10px 16px",
              fontSize: 13,
              cursor: "pointer",
            }}
          >

        ) : (
          <div style={{ border: `1px solid ${LINE}`, borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 13, color: INK_MUTED, marginBottom: 10 }}>
              Only do this if you're sure — if anything was saved before, starting fresh won't bring it

              <PrimaryBtn onClick={onStartFresh} style={{ background: "#B23A48", color: INK }}>

                Cancel
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Brand-autosuggest free text area.
   Type freely; if the word under your cursor matches the
   start of a brand name, tap the suggestion to complete it
   and keep typing. No catalog, no search — just a fast nudge.
--------------------------------------------------------- */
const BRAND_NAMES = Object.keys(BRAND_COLORS);

function getWordBeforeCursor(value, cursor) {
  const upto = value.slice(0, cursor);
  const match = upto.match(/[A-Za-z']+$/);
  return match ? match[0] : "";
}

function FreeTextPaintNotes({ value, onChange, placeholder }) {
  const taRef = useRef(null);
  const [cursor, setCursor] = useState(0);

  const word = getWordBeforeCursor(value, cursor);
  const suggestions =
    word.length > 0
      ? BRAND_NAMES.filter((b) => b.toLowerCase().startsWith(word.toLowerCase()) && b.toLowerCase() !== word.toLowerCase())
      : [];

  function trackCursor(e) {
    setCursor(e.target.selectionStart);
  }

  function applySuggestion(brand) {
    const el = taRef.current;
    const pos = cursor;
    const before = value.slice(0, pos - word.length);
    const after = value.slice(pos);
    const next = before + brand + " " + after;
    onChange(next);
    const newPos = before.length + brand.length + 1;
    requestAnimationFrame(() => {
      el.focus();
      el.setSelectionRange(newPos, newPos);
      setCursor(newPos);
    });
  }

  return (
    <div>
      <textarea
        ref={taRef}
        value={value}
        onChange={(e) => {
          onChange(e.target.value);
          trackCursor(e);
        }}
        onKeyUp={trackCursor}
        onClick={trackCursor}
        placeholder={placeholder}
        style={{
          width: "100%",
          minHeight: 64,
          background: BG,
          border: `1px solid ${LINE}`,
          borderRadius: 8,
          color: INK,
          padding: 8,
          fontSize: 16,
          resize: "vertical",
          lineHeight: 1.5,
        }}
      />
      {suggestions.length > 0 && (
        <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
          {suggestions.map((b) => (
            <button
              key={b}
              onMouseDown={(e) => {
                e.preventDefault();
                applySuggestion(b);
              }}
              style={{
                fontSize: 12,
                fontFamily: "'JetBrains Mono', monospace",
                color: brandTextColor(b),
                background: brandColor(b),
                border: "none",
                borderRadius: 6,
                padding: "4px 10px",
                cursor: "pointer",
              }}
            >
              {b}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState("shelf"); // shelf | mini | locker
  const [index, setIndex] = useState([]); // [{id,name,thumbnail}]
  const [paints, setPaints] = useState([]); // full paint objects
  const [currentId, setCurrentId] = useState(null);
  const [current, setCurrent] = useState(null); // full project object
  const [loadError, setLoadError] = useState(false);
  const [loaded, setLoaded] = useState(false);
  // 'loading' | 'ready' | 'error' — kept separate from `loaded` so a failed
  // read is never silently treated as "nothing saved yet."
  const [indexState, setIndexState] = useState("loading");
  const [paintsState, setPaintsState] = useState("loading");
  const [search, setSearch] = useState("");
  const fileRef = useRef(null);
  const stepFileRef = useRef({});

  async function getWithRetry(key, attempts = 3, delayMs = 500) {
    for (let i = 0; i < attempts; i++) {
      try {
        return await window.storage.get(key);
      } catch (err) {
        if (i === attempts - 1) throw err;
        await new Promise((r) => setTimeout(r, delayMs));
      }
    }
  }

  async function loadIndex() {
    setIndexState("loading");
    try {
      const res = await getWithRetry("project-index");
      setIndex(res ? JSON.parse(res.value) : []);
      setIndexState("ready");
    } catch (err) {
      console.error("Load index failed", err);
      setIndexState("error");
    }
  }

  async function loadPaints() {
    setPaintsState("loading");
    try {
      const res = await getWithRetry("paints");
      setPaints(res ? JSON.parse(res.value) : []);
      setPaintsState("ready");
    } catch (err) {
      console.error("Load paints failed", err);
      setPaintsState("error");
    }
  }

  // Explicit, user-confirmed action only — never triggered automatically.
  // Used when a load keeps failing and the person confirms there's genuinely
  // nothing saved yet (a brand-new setup), or when they want to reseed the
  // default paint catalog after ruling out a real outage.
  async function startFreshIndex() {
    setIndex([]);
    setIndexState("ready");
  }

  async function startFreshPaints() {
    const seeded = SEED_PAINTS.map(([brand, line, name]) => ({
      id: uid(),
      brand,
      line,
      name,
      color: guessSwatchColor(name),
      owned: false,
      custom: false,
    }));
    setPaints(seeded);
    await window.storage.set("paints", JSON.stringify(seeded));
    setPaintsState("ready");
  }

  // ---- initial load ----
  useEffect(() => {
    (async () => {
      await loadIndex();
      await loadPaints();
      setLoaded(true);
    })();
  }, []);

  const paintsSaveTimer = useRef(null);
  const pendingPaints = useRef(null);

  async function persistPaintsNow(next) {
    try {
      await window.storage.set("paints", JSON.stringify(next));
    } catch (err) {
      console.error("Save paints failed", err);
    }
  }

  function flushPaintsSave() {
    clearTimeout(paintsSaveTimer.current);
    const next = pendingPaints.current;
    pendingPaints.current = null;
    if (next) persistPaintsNow(next);
  }

  function savePaints(next) {
    setPaints(next);
    pendingPaints.current = next;
    clearTimeout(paintsSaveTimer.current);
    paintsSaveTimer.current = setTimeout(flushPaintsSave, 700);
  }

  const projectSaveTimer = useRef(null);
  const pendingProject = useRef(null);
  const indexSaveTimer = useRef(null);
  const pendingIndex = useRef(null);
  // In-memory cache of every project viewed or created this session, keyed by id.
  // Reopening a mini you've already visited reads from here — not from storage —
  // so a storage hiccup can't ever block navigation within a session.
  const projectCache = useRef({});

  async function persistProjectNow(proj) {
    try {
      const result = await window.storage.set("project:" + proj.id, JSON.stringify(proj));
      return !!result;
    } catch (err) {
      console.error("Save project failed", err);
      return false;
    }
  }

  function flushProjectSave() {
    clearTimeout(projectSaveTimer.current);
    const proj = pendingProject.current;
    pendingProject.current = null;
    if (proj) persistProjectNow(proj);
  }

  function scheduleProjectSave(proj) {
    pendingProject.current = proj;
    clearTimeout(projectSaveTimer.current);
    projectSaveTimer.current = setTimeout(flushProjectSave, 700);
  }

  async function persistIndexNow(next) {
    try {
      await window.storage.set("project-index", JSON.stringify(next));
    } catch (err) {
      console.error("Save index failed", err);
    }
  }

  function flushIndexSave() {
    clearTimeout(indexSaveTimer.current);
    const next = pendingIndex.current;
    pendingIndex.current = null;
    if (next) persistIndexNow(next);
  }

  function scheduleIndexSave(next) {
    pendingIndex.current = next;
    clearTimeout(indexSaveTimer.current);
    indexSaveTimer.current = setTimeout(flushIndexSave, 700);
  }

  // Immediate (non-debounced) index write — used for one-off actions like add/delete.
  async function saveIndex(next) {
    setIndex(next);
    pendingIndex.current = null;
    clearTimeout(indexSaveTimer.current);
    await persistIndexNow(next);
  }

  // Immediate (non-debounced) project write — used for one-off actions like creation.
  async function saveProject(proj) {
    setCurrent(proj);
    projectCache.current[proj.id] = proj;
    pendingProject.current = null;
    clearTimeout(projectSaveTimer.current);
    return persistProjectNow(proj);
  }

  async function fetchProject(id, attempt = 0) {
    try {
      const res = await window.storage.get("project:" + id);
      return res ? JSON.parse(res.value) : null;
    } catch (err) {
      if (attempt < 2) {
        await new Promise((r) => setTimeout(r, 300));
        return fetchProject(id, attempt + 1);
      }
      throw err;
    }
  }

  // Bundle everything — every mini's full data, the paint locker — into one
  // downloadable file. This is the person's own portable copy, independent
  // of storage, this app, or Claude entirely.
  async function exportAllData() {
    const projects = {};
    for (const entry of index) {
      const cached = projectCache.current[entry.id];
      if (cached) {
        projects[entry.id] = cached;
        continue;
      }
      try {
        const proj = await fetchProject(entry.id);
        if (proj) projects[entry.id] = proj;
      } catch (err) {
        console.error("Export: couldn't fetch project", entry.id, err);
      }
    }
    const bundle = {
      app: "mini-tracker",
      version: 1,
      exportedAt: new Date().toISOString(),
      index,
      projects,
      paints,
    };
    const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `mini-tracker-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Restores from a previously exported file. Overwrites current data, so
  // the UI confirms with the person before calling this.
  async function importAllData(bundle) {
    const nextIndex = Array.isArray(bundle.index) ? bundle.index : [];
    const nextPaints = Array.isArray(bundle.paints) ? bundle.paints : [];
    const projects = bundle.projects && typeof bundle.projects === "object" ? bundle.projects : {};

    for (const [id, proj] of Object.entries(projects)) {
      projectCache.current[id] = proj;
      await persistProjectNow(proj);
    }
    await saveIndex(nextIndex);
    savePaints(nextPaints);
    flushPaintsSave();
  }

  function openProject(id) {
    // Make sure any edits to whatever was open before actually land first.
    flushProjectSave();
    flushIndexSave();
    setCurrentId(id);
    setView("mini");
    setLoadError(false);

    // Already seen this session — use it directly, no storage round-trip at all.
    const cached = projectCache.current[id];
    if (cached) {
      setCurrent(cached);
      return;
    }

    setCurrent(null);
    (async () => {
      try {
        const proj = await fetchProject(id);
        if (proj) {
          projectCache.current[id] = proj;
          setCurrent(proj);
        } else {
          setLoadError(true);
        }
      } catch (err) {
        console.error("Load project failed", err);
        setLoadError(true);
      }
    })();
  }

  async function createProject() {
    const id = uid();
    const proj = {
      id,
      name: "",
      notes: "",
      thumbnail: null,
      sections: DEFAULT_SECTIONS.map((s) => ({ ...s })),
      steps: [],
    };
    await saveProject(proj);
    const nextIndex = [{ id, name: proj.name, thumbnail: null }, ...index];
    await saveIndex(nextIndex);
    setCurrentId(id);
    setView("mini");
  }

  async function deleteProject(id) {
    const nextIndex = index.filter((p) => p.id !== id);
    await saveIndex(nextIndex);
    delete projectCache.current[id];
    try {
      await window.storage.delete("project:" + id);
    } catch (err) {
      // ignore — best effort
    }
    if (currentId === id) {
      setView("shelf");
      setCurrent(null);
      setCurrentId(null);
    }
  }

  function updateCurrent(patch) {
    const next = { ...current, ...patch };
    setCurrent(next);
    projectCache.current[next.id] = next;
    scheduleProjectSave(next);
    if (patch.name !== undefined || patch.thumbnail !== undefined) {
      const nextIndex = index.map((p) =>
        p.id === current.id
          ? { ...p, name: patch.name ?? p.name, thumbnail: patch.thumbnail ?? p.thumbnail }
          : p
      );
      setIndex(nextIndex);
      scheduleIndexSave(nextIndex);
    }
  }

  async function handleThumbUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const dataUrl = await fileToResizedDataUrl(file, 400, 0.7);
    await updateCurrent({ thumbnail: dataUrl });
  }

  async function handleStepPhoto(stepId, file) {
    if (!file) return;
    const dataUrl = await fileToResizedDataUrl(file, 500, 0.65);
    const steps = current.steps.map((s) => (s.id === stepId ? { ...s, photo: dataUrl } : s));
    await updateCurrent({ steps });
  }

  function addStep(section) {
    const steps = [
      ...current.steps,
      { id: uid(), section, title: "", photo: null, notes: "" },
    ];
    updateCurrent({ steps });
  }

  function updateStep(stepId, patch) {
    const steps = current.steps.map((s) => (s.id === stepId ? { ...s, ...patch } : s));
    updateCurrent({ steps });
  }

  function removeStep(stepId) {
    const steps = current.steps.filter((s) => s.id !== stepId);
    updateCurrent({ steps });
  }

  function addSection(label) {
    const existing = current.sections || DEFAULT_SECTIONS;
    const sections = [...existing, { id: uid(), label }];
    updateCurrent({ sections });
  }

  function renameSection(id, label) {
    const existing = current.sections || DEFAULT_SECTIONS;
    const sections = existing.map((s) => (s.id === id ? { ...s, label } : s));
    updateCurrent({ sections });
  }

  function removeSection(id) {
    const existing = current.sections || DEFAULT_SECTIONS;
    const sections = existing.filter((s) => s.id !== id);
    const steps = current.steps.filter((s) => s.section !== id);
    updateCurrent({ sections, steps });
  }

  const filteredIndex = useMemo(() => {
    if (!search.trim()) return index;
    const s = search.toLowerCase();
    return index.filter((p) => p.name.toLowerCase().includes(s));
  }, [index, search]);

  if (!loaded) {
    return (
      <div style={{ background: BG, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: INK_MUTED, fontFamily: "Inter, sans-serif" }}>
        Loading the workbench…
      </div>
    );
  }

  if (view === "shelf" && indexState === "error") {
    return (
      <DataLoadError
        message="Couldn't load your saved miniatures. Your data is very likely still there — this is just a connection hiccup. Please retry rather than starting fresh if you have anything saved."
        onRetry={loadIndex}
        onStartFresh={startFreshIndex}
      />
    );
  }

  if (view === "locker" && paintsState === "error") {
    return (
      <DataLoadError
        message="Couldn't load your paint locker. Your saved paints are very likely still there — this is just a connection hiccup. Please retry rather than starting fresh if you've added any."
        onRetry={loadPaints}
        onStartFresh={startFreshPaints}
      />
    );
  }

  return (
    <div
      style={{
        background: BG,
        minHeight: "100vh",
        fontFamily: "Inter, sans-serif",
        color: INK,
      }}
    >
      <style>{`
        * { box-sizing: border-box; }
        input, textarea { font-family: 'Inter', sans-serif; }
        input:focus, textarea:focus, button:focus-visible {
          outline: 2px solid ${GOLD};
          outline-offset: 1px;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${LINE}; border-radius: 4px; }
        @media (prefers-reduced-motion: reduce) {
          * { transition: none !important; animation: none !important; }
        }
      `}</style>

      {view === "shelf" && (
        <ShelfView
          index={filteredIndex}
          search={search}
          setSearch={setSearch}
          onOpen={openProject}
          onCreate={createProject}
          onOpenLocker={() => setView("locker")}
          onOpenBackup={() => setView("backup")}
        />
      )}

      {view === "mini" && (
        <MiniView
          project={current}
          loadError={loadError}
          onRetry={() => openProject(currentId)}
          onBack={() => {
            flushProjectSave();
            flushIndexSave();
            setView("shelf");
          }}
          onUpdate={updateCurrent}
          onThumbUpload={handleThumbUpload}
          fileRef={fileRef}
          onAddStep={addStep}
          onUpdateStep={updateStep}
          onRemoveStep={removeStep}
          onStepPhoto={handleStepPhoto}
          onAddSection={addSection}
          onRenameSection={renameSection}
          onRemoveSection={removeSection}
          onDelete={() => deleteProject(current.id)}
        />
      )}

      {view === "locker" && (
        <LockerView
          paints={paints}
          onBack={() => {
            flushPaintsSave();
            setView("shelf");
          }}
          onSave={savePaints}
        />
      )}

      {view === "backup" && (
        <BackupView
          miniCount={index.length}
          paintCount={paints.length}
          onBack={() => setView("shelf")}
          onExport={exportAllData}
          onImport={importAllData}
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Mini detail view
--------------------------------------------------------- */
function MiniView({
  project,
  loadError,
  onRetry,
  onBack,
  onUpdate,
  onThumbUpload,
  fileRef,
  onAddStep,
  onUpdateStep,
  onRemoveStep,
  onStepPhoto,
  onAddSection,
  onRenameSection,
  onRemoveSection,
  onDelete,
}) {
  const [confirmDelete, setConfirmDelete] = useState(false);

  if (loadError) {
    return (
      <div style={{ maxWidth: 640, margin: "0 auto", padding: 20 }}>
        <IconBtn onClick={onBack} label="Back to shelf" style={{ marginBottom: 20 }}>
          <ArrowLeft size={18} />
        </IconBtn>
        <div style={{ color: INK_MUTED, fontSize: 14, marginBottom: 14 }}>
          This miniature didn't load. Your data is likely still there — try again.
        </div>
        <PrimaryBtn onClick={onRetry}>Try again</PrimaryBtn>
      </div>
    );
  }

  if (!project) {
    return (
      <div style={{ maxWidth: 640, margin: "0 auto", padding: 20, color: INK_MUTED }}>
        Loading…
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "20px 20px 80px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 22 }}>
        <IconBtn onClick={onBack} label="Back to shelf">
          <ArrowLeft size={18} />
        </IconBtn>
        <div style={{ flex: 1 }} />
        <IconBtn onClick={() => setConfirmDelete(true)} label="Delete miniature">
          <Trash2 size={16} />
        </IconBtn>
      </div>

      {confirmDelete && (
        <div
          style={{
            background: SURFACE,
            border: `1px solid ${LINE}`,
            borderRadius: 12,
            padding: 16,
            marginBottom: 18,
          }}
        >
          <div style={{ fontSize: 14, marginBottom: 12 }}>
            Remove "{project.name}" from the shelf? This can't be undone.
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <PrimaryBtn onClick={onDelete} style={{ background: "#B23A48", color: INK }}>
              Delete
            </PrimaryBtn>
            <button
              onClick={() => setConfirmDelete(false)}
              style={{ background: "transparent", border: `1px solid ${LINE}`, color: INK, borderRadius: 10, padding: "10px 16px", cursor: "pointer" }}
            >
              Cancel
            </button>
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 18, alignItems: "center", marginBottom: 22 }}>
        <div style={{ position: "relative" }}>
          <BaseThumb src={project.thumbnail} size={92} onClick={() => fileRef.current?.click()} />
          <input
            ref={fileRef}
            type="file"
            accept="image/*"
            style={{ display: "none" }}
            onChange={onThumbUpload}
          />
        </div>
        <input
          value={project.name}
          onChange={(e) => onUpdate({ name: e.target.value })}
          placeholder="Miniature name"
          style={{
            flex: 1,
            background: "transparent",
            border: "none",
            borderBottom: `2px solid ${LINE}`,
            color: INK,
            fontFamily: "'Barlow Condensed', sans-serif",
            fontWeight: 700,
            fontSize: 26,
            textTransform: "uppercase",
            letterSpacing: 0.5,
            padding: "6px 0",
            outline: "none",
          }}
        />
      </div>

      <textarea
        value={project.notes}
        onChange={(e) => onUpdate({ notes: e.target.value })}
        placeholder="General notes about this mini — model line, scale, conversions…"
        style={{
          width: "100%",
          minHeight: 60,
          background: SURFACE,
          border: `1px solid ${LINE}`,
          borderRadius: 10,
          color: INK,
          padding: 12,
          fontSize: 16,
          resize: "vertical",
          marginBottom: 26,
        }}
      />

      {(project.sections || DEFAULT_SECTIONS).map((sec) => {
        // Steps saved before sections existed have no `section` — treat them as Model.
        const sectionSteps = project.steps.filter((s) => (s.section || "model") === sec.id);
        return (
          <SectionBlock
            key={sec.id}
            section={sec}
            steps={sectionSteps}
            onAddStep={() => onAddStep(sec.id)}
            onUpdateStep={onUpdateStep}
            onRemoveStep={onRemoveStep}
            onStepPhoto={onStepPhoto}
            onRename={(label) => onRenameSection(sec.id, label)}
            onRemoveSection={() => onRemoveSection(sec.id)}
          />
        );
      })}

      <AddSectionControl onAdd={onAddSection} />
    </div>
  );
}

function SectionBlock({ section, steps, onAddStep, onUpdateStep, onRemoveStep, onStepPhoto, onRename, onRemoveSection }) {
  const [editingLabel, setEditingLabel] = useState(false);
  const [labelVal, setLabelVal] = useState(section.label);
  const [confirmRemove, setConfirmRemove] = useState(false);

  function commitLabel() {
    setEditingLabel(false);
    if (labelVal.trim() && labelVal !== section.label) onRename(labelVal.trim());
    else setLabelVal(section.label);
  }

  return (
    <div style={{ marginBottom: 30 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, gap: 8 }}>
        {editingLabel ? (
          <input
            autoFocus
            value={labelVal}
            onChange={(e) => setLabelVal(e.target.value)}
            onFocus={(e) => e.target.select()}
            onBlur={commitLabel}
            onKeyDown={(e) => e.key === "Enter" && commitLabel()}
            style={{
              flex: 1,
              background: "transparent",
              border: "none",
              borderBottom: `2px solid ${LINE}`,
              color: INK,
              fontFamily: "'Barlow Condensed', sans-serif",
              fontWeight: 700,
              fontSize: 20,
              textTransform: "uppercase",
              letterSpacing: 1,
              outline: "none",
            }}
          />
        ) : (
          <h2
            onClick={() => setEditingLabel(true)}
            style={{
              fontFamily: "'Barlow Condensed', sans-serif",
              fontWeight: 700,
              fontSize: 20,
              textTransform: "uppercase",
              letterSpacing: 1,
              margin: 0,
              color: INK_MUTED,
              cursor: "pointer",
              flex: 1,
            }}
          >
            {section.label}
          </h2>
        )}
        <PrimaryBtn onClick={onAddStep}>
          <Plus size={15} /> Add step
        </PrimaryBtn>
        <IconBtn onClick={() => setConfirmRemove(true)} label="Remove division" style={{ width: 32, height: 32 }}>
          <Trash2 size={14} />
        </IconBtn>
      </div>

      {confirmRemove && (
        <div style={{ background: SURFACE, border: `1px solid ${LINE}`, borderRadius: 10, padding: 12, marginBottom: 14 }}>
          <div style={{ fontSize: 13, marginBottom: 10, color: INK }}>
            Remove "{section.label}"{steps.length > 0 ? ` and its ${steps.length} step${steps.length === 1 ? "" : "s"}` : ""}?
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <PrimaryBtn onClick={onRemoveSection} style={{ background: "#B23A48", color: INK }}>
              Remove
            </PrimaryBtn>
            <button
              onClick={() => setConfirmRemove(false)}
              style={{ background: "transparent", border: `1px solid ${LINE}`, color: INK, borderRadius: 10, padding: "10px 16px", cursor: "pointer" }}
            >
              Cancel
            </button>
          </div>
        </div>
      )}

      {steps.length === 0 && (
        <div style={{ color: INK_MUTED, fontSize: 14, padding: "6px 0 20px" }}>
          No steps yet in {section.label}.
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {steps.map((step, i) => (
          <StepCard
            key={step.id}
            index={i + 1}
            step={step}
            onUpdate={(patch) => onUpdateStep(step.id, patch)}
            onRemove={() => onRemoveStep(step.id)}
            onPhoto={(file) => onStepPhoto(step.id, file)}
          />
        ))}
      </div>
    </div>
  );
}

function AddSectionControl({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [val, setVal] = useState("");

  function submit() {
    if (!val.trim()) return;
    onAdd(val.trim());
    setVal("");
    setOpen(false);
  }

  if (!open) {
    return (
      <button
        onClick={() => setOpen(true)}
        style={{
          width: "100%",
          background: "transparent",
          border: `1px dashed ${LINE}`,
          color: INK_MUTED,
          borderRadius: 10,
          padding: "12px 16px",
          fontSize: 14,
          cursor: "pointer",
          marginTop: 4,
        }}
      >
        + Add another division
      </button>
    );
  }

  return (
    <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
      <input
        autoFocus
        value={val}
        onChange={(e) => setVal(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && submit()}
        placeholder="Division name — e.g. Fox, Familiar, Banner"
        style={{
          flex: 1,
          background: SURFACE,
          border: `1px solid ${LINE}`,
          color: INK,
          borderRadius: 10,
          padding: "10px 12px",
          fontSize: 16,
        }}
      />
      <PrimaryBtn onClick={submit} disabled={!val.trim()}>
        Add
      </PrimaryBtn>
      <button
        onClick={() => {
          setOpen(false);
          setVal("");
        }}
        style={{ background: "transparent", border: `1px solid ${LINE}`, color: INK, borderRadius: 10, padding: "0 16px", cursor: "pointer" }}
      >
        Cancel
      </button>
    </div>
  );
}

/* ---------------------------------------------------------
   Paint Locker (catalog) view
--------------------------------------------------------- */
function LockerView({ paints, onBack, onSave }) {
  const [q, setQ] = useState("");
  const [ownedOnly, setOwnedOnly] = useState(false);
  const [newName, setNewName] = useState("");
  const [newBrand, setNewBrand] = useState(Object.keys(BRAND_COLORS)[0]);
  const [bulkOpen, setBulkOpen] = useState(false);
  const [bulkBrand, setBulkBrand] = useState(Object.keys(BRAND_COLORS)[0]);
  const [bulkLine, setBulkLine] = useState("");
  const [bulkText, setBulkText] = useState("");

  const brands = useMemo(() => {
    const set = new Set(paints.map((p) => p.brand));
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }, [paints]);

  const brandOptions = useMemo(() => {
    const set = new Set([...Object.keys(BRAND_COLORS), ...paints.map((p) => p.brand)]);
    return Array.from(set);
  }, [paints]);

  const filtered = useMemo(() => {
    let pool = paints;
    if (ownedOnly) pool = pool.filter((p) => p.owned);
    if (!q.trim()) return pool;
    const s = q.toLowerCase();
    return pool.filter(
      (p) =>
        p.name.toLowerCase().includes(s) ||
        p.brand.toLowerCase().includes(s) ||
        (p.line || "").toLowerCase().includes(s)
    );
  }, [paints, q, ownedOnly]);

  function toggleOwned(id) {
    onSave(paints.map((p) => (p.id === id ? { ...p, owned: !p.owned } : p)));
  }

  function renamePaint(id, name) {
    onSave(paints.map((p) => (p.id === id ? { ...p, name } : p)));
  }

  function deletePaint(id) {
    onSave(paints.filter((p) => p.id !== id));
  }

  function addCustom() {
    if (!newName.trim() || !newBrand.trim()) return;
    const paint = {
      id: uid(),
      brand: newBrand.trim(),
      line: "Custom",
      name: newName.trim(),
      color: guessSwatchColor(newName),
      owned: true,
      custom: true,
    };
    onSave([paint, ...paints]);
    setNewName("");
  }

  // Paste a list (one paint per line — dashes/bullets are stripped) and add
  // them all at once. Re-pasting an updated list skips anything already in
  // the locker for that brand, so it's safe to run again after a new release.
  const bulkLines = useMemo(() => {
    return bulkText
      .split(/\r?\n/)
      .map((l) => l.replace(/^[\s\-*•\u2022]+/, "").trim())
      .filter(Boolean);
  }, [bulkText]);

  const bulkNewCount = useMemo(() => {
    if (!bulkBrand.trim()) return 0;
    const existingKeys = new Set(paints.map((p) => (p.brand + "|" + p.name).toLowerCase()));
    let count = 0;
    for (const name of bulkLines) {
      if (!existingKeys.has((bulkBrand.trim() + "|" + name).toLowerCase())) count++;
    }
    return count;
  }, [bulkLines, bulkBrand, paints]);

  function bulkImport() {
    if (!bulkBrand.trim() || bulkLines.length === 0) return;
    const existingKeys = new Set(paints.map((p) => (p.brand + "|" + p.name).toLowerCase()));
    const additions = [];
    for (const name of bulkLines) {
      const key = (bulkBrand.trim() + "|" + name).toLowerCase();
      if (existingKeys.has(key)) continue;
      existingKeys.add(key);
      additions.push({
        id: uid(),
        brand: bulkBrand.trim(),
        line: bulkLine.trim() || "Imported",
        name,
        color: guessSwatchColor(name),
        owned: false,
        custom: true,
      });
    }
    if (additions.length === 0) return;
    onSave([...additions, ...paints]);
    setBulkText("");
    setBulkOpen(false);
  }

  const ownedCount = paints.filter((p) => p.owned).length;

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "20px 20px 80px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <IconBtn onClick={onBack} label="Back to shelf">
          <ArrowLeft size={18} />
        </IconBtn>
        <h1
          style={{
            fontFamily: "'Barlow Condensed', sans-serif",
            fontWeight: 800,
            fontSize: 28,
            textTransform: "uppercase",
            letterSpacing: 1,
            margin: 0,
          }}
        >
          Paint Locker
        </h1>
      </div>
      <p style={{ color: INK_MUTED, fontSize: 14, marginBottom: 20 }}>
        {ownedCount} of {paints.length} marked as owned. Check off what's on your rack — the step
        picker can filter to these.
      </p>

      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <div
          style={{
            flex: 1,
            display: "flex",
            alignItems: "center",
            gap: 8,
            background: SURFACE,
            border: `1px solid ${LINE}`,
            borderRadius: 10,
            padding: "10px 14px",
          }}
        >
          <Search size={16} color={INK_MUTED} />
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder="Search by name, brand, or line…"
            style={{ background: "transparent", border: "none", outline: "none", color: INK, fontSize: 16, width: "100%" }}
          />
        </div>
        <button
          onClick={() => setOwnedOnly(!ownedOnly)}
          style={{
            fontSize: 13,
            fontFamily: "'JetBrains Mono', monospace",
            background: ownedOnly ? GOLD : SURFACE,
            color: ownedOnly ? "#201E1D" : INK_MUTED,
            border: `1px solid ${ownedOnly ? GOLD : LINE}`,
            borderRadius: 10,
            padding: "0 14px",
            cursor: "pointer",
            whiteSpace: "nowrap",
          }}
        >
          owned only
        </button>
      </div>

      <datalist id="brand-options">
        {brandOptions.map((b) => (
          <option key={b} value={b} />
        ))}
      </datalist>

      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <input
          list="brand-options"
          value={newBrand}
          onChange={(e) => setNewBrand(e.target.value)}
          placeholder="Brand"
          style={{
            width: 130,
            background: SURFACE,
            border: `1px solid ${LINE}`,
            color: INK,
            borderRadius: 10,
            padding: "10px 12px",
            fontSize: 16,
          }}
        />
        <input
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addCustom()}
          placeholder="Add a paint name…"
          style={{
            flex: 1,
            minWidth: 140,
            background: SURFACE,
            border: `1px solid ${LINE}`,
            color: INK,
            borderRadius: 10,
            padding: "10px 12px",
            fontSize: 16,
          }}
        />
        <PrimaryBtn onClick={addCustom} disabled={!newName.trim() || !newBrand.trim()}>
          <Plus size={15} /> Add
        </PrimaryBtn>
      </div>

      {!bulkOpen ? (
        <button
          onClick={() => setBulkOpen(true)}
          style={{
            width: "100%",
            background: "transparent",
            border: `1px dashed ${LINE}`,
            color: INK_MUTED,
            borderRadius: 10,
            padding: "10px 16px",
            fontSize: 14,
            cursor: "pointer",
            marginBottom: 24,
          }}
        >
          + Paste in a whole list
        </button>
      ) : (
        <div style={{ background: SURFACE, border: `1px solid ${LINE}`, borderRadius: 12, padding: 14, marginBottom: 24 }}>
          <div style={{ fontSize: 13, color: INK_MUTED, marginBottom: 10 }}>
            Paste one paint name per line — from a manufacturer's site, a spreadsheet, wherever.
            Re-pasting an updated list later skips anything already in the locker for that brand.
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input
              list="brand-options"
              value={bulkBrand}
              onChange={(e) => setBulkBrand(e.target.value)}
              placeholder="Brand"
              style={{
                width: 130,
                background: BG,
                border: `1px solid ${LINE}`,
                color: INK,
                borderRadius: 10,
                padding: "10px 12px",
                fontSize: 16,
              }}
            />
            <input
              value={bulkLine}
              onChange={(e) => setBulkLine(e.target.value)}
              placeholder="Line/series (optional)"
              style={{
                flex: 1,
                background: BG,
                border: `1px solid ${LINE}`,
                color: INK,
                borderRadius: 10,
                padding: "10px 12px",
                fontSize: 16,
              }}
            />
          </div>
          <textarea
            value={bulkText}
            onChange={(e) => setBulkText(e.target.value)}
            placeholder={"Abaddon Black\nCorax White\nMephiston Red…"}
            style={{
              width: "100%",
              minHeight: 120,
              background: BG,
              border: `1px solid ${LINE}`,
              color: INK,
              borderRadius: 10,
              padding: 12,
              fontSize: 16,
              resize: "vertical",
              marginBottom: 10,
            }}
          />
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <PrimaryBtn onClick={bulkImport} disabled={bulkNewCount === 0 || !bulkBrand.trim()}>
              Add {bulkNewCount > 0 ? bulkNewCount : ""} paint{bulkNewCount === 1 ? "" : "s"}
            </PrimaryBtn>
            <button
              onClick={() => {
                setBulkOpen(false);
                setBulkText("");
              }}
              style={{ background: "transparent", border: `1px solid ${LINE}`, color: INK, borderRadius: 10, padding: "10px 16px", cursor: "pointer" }}
            >
              Cancel
            </button>
          </div>
        </div>
      )}

      {brands.map((brand) => {
        const brandPaints = filtered.filter((p) => p.brand === brand);
        if (brandPaints.length === 0) return null;
        const lines = Array.from(new Set(brandPaints.map((p) => p.line || "Other"))).sort((a, b) =>
          a.localeCompare(b)
        );
        return (
          <div key={brand} style={{ marginBottom: 22 }}>
            <div
              style={{
                display: "inline-block",
                fontFamily: "'JetBrains Mono', monospace",
                fontSize: 11,
                letterSpacing: 0.5,
                color: brandTextColor(brand),
                background: brandColor(brand),
                padding: "3px 10px",
                borderRadius: 6,
                marginBottom: 10,
              }}
            >
              {brand}
            </div>
            {lines.map((line) => {
              const linePaints = brandPaints
                .filter((p) => (p.line || "Other") === line)
                .sort((a, b) => a.name.localeCompare(b.name));
              return (
                <div key={line} style={{ marginBottom: 10 }}>
                  {lines.length > 1 && (
                    <div style={{ fontSize: 12, color: INK_MUTED, margin: "6px 0 4px 2px" }}>
                      {line}
                    </div>
                  )}
                  <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                    {linePaints.map((p) => (
                      <PaintRow
                        key={p.id}
                        paint={p}
                        onToggle={() => toggleOwned(p.id)}
                        onRename={(name) => renamePaint(p.id, name)}
                        onDelete={() => deletePaint(p.id)}
                      />
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

function PaintRow({ paint, onToggle, onRename, onDelete }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(paint.name);

  function commit() {
    setEditing(false);
    if (val.trim() && val !== paint.name) onRename(val.trim());
  }

  return (
    <div
      style={{
        display: "flex",
        alignItems: "center",
        gap: 10,
        padding: "8px 10px",
        borderRadius: 8,
        background: paint.owned ? "rgba(201,162,39,0.08)" : "transparent",
      }}
    >
      <button
        onClick={onToggle}
        aria-label={paint.owned ? "Mark not owned" : "Mark owned"}
        style={{
          width: 22,
          height: 22,
          borderRadius: 6,
          border: `1px solid ${paint.owned ? GOLD : LINE}`,
          background: paint.owned ? GOLD : "transparent",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          cursor: "pointer",
          flexShrink: 0,
        }}
      >
        {paint.owned && <Check size={14} color="#201E1D" />}
      </button>
      <span style={{ width: 12, height: 12, borderRadius: "50%", background: paint.color, flexShrink: 0 }} />
      {editing ? (
        <input
          autoFocus
          value={val}
          onChange={(e) => setVal(e.target.value)}
          onFocus={(e) => e.target.select()}
          onBlur={commit}
          onKeyDown={(e) => e.key === "Enter" && commit()}
          style={{
            flex: 1,
            background: SURFACE,
            border: `1px solid ${LINE}`,
            borderRadius: 6,
            color: INK,
            fontSize: 16,
            padding: "4px 8px",
          }}
        />
      ) : (
        <span style={{ flex: 1, fontSize: 14, color: INK }}>{paint.name}</span>
      )}
      {paint.line && !editing && (
        <span style={{ fontSize: 11, color: INK_MUTED, fontFamily: "'JetBrains Mono', monospace" }}>{paint.line}</span>
      )}
      <IconBtn onClick={() => setEditing(!editing)} label="Rename paint" style={{ width: 30, height: 30 }}>
        <Edit3 size={13} />
      </IconBtn>
      <IconBtn onClick={onDelete} label="Delete paint" style={{ width: 30, height: 30 }}>
        <Trash2 size={13} />
      </IconBtn>
    </div>
  );
}

/* ---------------------------------------------------------
   Backup & Restore — your own portable copy of everything,
   independent of storage, this app, or Claude entirely.
--------------------------------------------------------- */
function BackupView({ miniCount, paintCount, onBack, onExport, onImport }) {
  const [exporting, setExporting] = useState(false);
  const [importing, setImporting] = useState(false);
  const [pendingFile, setPendingFile] = useState(null);
  const [status, setStatus] = useState(null); // { type: 'success'|'error', message }
  const fileInputRef = useRef(null);

  async function handleExport() {
    setExporting(true);
    setStatus(null);
    try {
      await onExport();
      setStatus({ type: "success", message: "Backup downloaded." });
    } catch (err) {
      console.error(err);
      setStatus({ type: "error", message: "Export failed — try again." });
    }
    setExporting(false);
  }

  function handleFileChosen(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setPendingFile(file);
    setStatus(null);
  }

  async function confirmImport() {
    if (!pendingFile) return;
    setImporting(true);
    setStatus(null);
    try {
      const text = await pendingFile.text();
      const bundle = JSON.parse(text);
      if (!bundle || bundle.app !== "mini-tracker") {
        throw new Error("This doesn't look like a mini-tracker backup file.");
      }
      await onImport(bundle);
      setStatus({ type: "success", message: "Restored from backup." });
      setPendingFile(null);
    } catch (err) {
      console.error(err);
      setStatus({ type: "error", message: err.message || "Couldn't read that file." });
    }
    setImporting(false);
  }

  return (
    <div style={{ maxWidth: 560, margin: "0 auto", padding: "20px 20px 80px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <IconBtn onClick={onBack} label="Back to shelf">
          <ArrowLeft size={18} />
        </IconBtn>
        <h1
          style={{
            fontFamily: "'Barlow Condensed', sans-serif",
            fontWeight: 800,
            fontSize: 28,
            textTransform: "uppercase",
            letterSpacing: 1,
            margin: 0,
          }}
        >
          Backup &amp; Restore
        </h1>
      </div>

      <p style={{ color: INK_MUTED, fontSize: 14, marginBottom: 24, lineHeight: 1.5 }}>
        This downloads everything — every miniature, every step, your whole paint locker — as one
        file you keep. It's your own copy, independent of this app.
      </p>

      <div style={{ background: SURFACE, border: `1px solid ${LINE}`, borderRadius: 14, padding: 18, marginBottom: 18 }}>
        <h2
          style={{
            fontFamily: "'Barlow Condensed', sans-serif",
            fontWeight: 700,
            fontSize: 18,
            textTransform: "uppercase",
            letterSpacing: 1,
            margin: "0 0 8px",
            color: INK_MUTED,
          }}
        >
          Export
        </h2>
        <p style={{ fontSize: 13, color: INK_MUTED, marginBottom: 14 }}>
          {miniCount} {miniCount === 1 ? "miniature" : "miniatures"}, {paintCount} paints. Do this
          every so often — after a big painting session, or before any update to the app.
        </p>
        <PrimaryBtn onClick={handleExport} disabled={exporting}>
          <Download size={16} /> {exporting ? "Preparing…" : "Download backup"}
        </PrimaryBtn>
      </div>

      <div style={{ background: SURFACE, border: `1px solid ${LINE}`, borderRadius: 14, padding: 18 }}>
        <h2
          style={{
            fontFamily: "'Barlow Condensed', sans-serif",
            fontWeight: 700,
            fontSize: 18,
            textTransform: "uppercase",
            letterSpacing: 1,
            margin: "0 0 8px",
            color: INK_MUTED,
          }}
        >
          Restore
        </h2>
        <p style={{ fontSize: 13, color: INK_MUTED, marginBottom: 14 }}>
          Loads a backup file back in. This replaces what's currently here, so only do this if
          that's what you want.
        </p>

        <input
          ref={fileInputRef}
          type="file"
          accept="application/json,.json"
          style={{ display: "none" }}
          onChange={handleFileChosen}
        />

        {!pendingFile ? (
          <button
            onClick={() => fileInputRef.current?.click()}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 8,
              background: "transparent",
              border: `1px dashed ${LINE}`,
              color: INK_MUTED,
              borderRadius: 10,
              padding: "10px 16px",
              fontSize: 14,
              cursor: "pointer",
            }}
          >
            <Upload size={16} /> Choose a backup file…
          </button>
        ) : (
          <div style={{ border: `1px solid ${LINE}`, borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 13, color: INK, marginBottom: 10 }}>
              Restore from <strong>{pendingFile.name}</strong>? This replaces everything currently
              here — there's no undo once you confirm.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <PrimaryBtn onClick={confirmImport} disabled={importing} style={{ background: "#B23A48", color: INK }}>
                {importing ? "Restoring…" : "Yes, replace everything"}
              </PrimaryBtn>
              <button
                onClick={() => setPendingFile(null)}
                style={{ background: "transparent", border: `1px solid ${LINE}`, color: INK, borderRadius: 10, padding: "10px 16px", cursor: "pointer" }}
              >
                Cancel
              </button>
            </div>
          </div>
        )}
      </div>

      {status && (
        <div
          style={{
            marginTop: 16,
            fontSize: 13,
            color: status.type === "error" ? "#B23A48" : GOLD,
          }}
        >
          {status.message}
        </div>
      )}
    </div>
  );
}
