<script>
// Self-diagnosing error banner — so a blank/black screen always shows
// what actually went wrong instead of nothing at all.
(function () {
  var shown = false;
  function showError(title, detail) {
    var box = document.getElementById('boot-error');
    box.style.display = 'block';
    box.innerHTML = '<strong>' + title + '</strong><br><span style="opacity:.85">' + detail + '</span>';
    shown = true;
  }
  window.addEventListener('error', function (e) {
    var loc = e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '';
    showError('Something failed while loading the app', (e.message || 'Unknown error') + loc);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var msg = (e.reason && e.reason.message) || String(e.reason);
    showError('Something failed while loading the app', msg);
  });
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && root.children.length === 0 && !shown) {
      showError(
        'The app never started',
        'One of the required scripts (React, Supabase) likely failed to load — often a network hiccup or a slow connection. Try reloading. If it keeps happening, check your internet connection.'
      );
    }
  }, 6000);
})();
</script>

<script>
// Storage adapter — implements the same window.storage.get/set/delete/list
// interface the app already uses, but backed by your own Supabase project
// instead of Claude's storage. Nothing else in the app had to change.
(function () {
  const SUPABASE_URL = "https://adgsdwrktkonlwtpbvdy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Y8Li2Qt9LLbFn5h0Mh_mdw_Le3HdgUE";

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  window.storage = {
    async get(key) {
      const { data, error } = await client
        .from("kv_store")
        .select("value")
        .eq("key", key)
        .maybeSingle();
      if (error) throw error;
      if (!data) throw new Error("not found: " + key);
      return { key, value: data.value, shared: false };
    },

    async set(key, value) {
      const { error } = await client
        .from("kv_store")
        .upsert({ key, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return { key, value, shared: false };
    },

    async delete(key) {
      const { error } = await client.from("kv_store").delete().eq("key", key);
      return { key, deleted: !error, shared: false };
    },

    async list(prefix) {
      let query = client.from("kv_store").select("key");
      if (prefix) query = query.like("key", prefix + "%");
      const { data, error } = await query;
      if (error) throw error;
      return { keys: (data || []).map((d) => d.key), prefix, shared: false };
    },
  };
})();
</script>
